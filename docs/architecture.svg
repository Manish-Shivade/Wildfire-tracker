<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="900" height="460" fill="#0b1220"/>

  <!-- Title -->
  <text x="450" y="34" fill="#e2e8f0" font-size="20" font-weight="600" text-anchor="middle">Wildfire Tracker — Architecture</text>

  <!-- Dev -->
  <rect x="30" y="70" width="150" height="60" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="105" y="95" fill="#e2e8f0" font-size="13" text-anchor="middle">Developer</text>
  <text x="105" y="113" fill="#94a3b8" font-size="11" text-anchor="middle">git push</text>

  <!-- GitHub -->
  <rect x="230" y="70" width="150" height="60" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="305" y="95" fill="#e2e8f0" font-size="13" text-anchor="middle">GitHub</text>
  <text x="305" y="113" fill="#94a3b8" font-size="11" text-anchor="middle">Actions CI · Dependabot</text>

  <!-- Jenkins -->
  <rect x="430" y="70" width="160" height="60" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="510" y="95" fill="#e2e8f0" font-size="13" text-anchor="middle">Jenkins Pipeline</text>
  <text x="510" y="113" fill="#94a3b8" font-size="11" text-anchor="middle">lint · scan · build</text>

  <!-- ECR -->
  <rect x="640" y="70" width="150" height="60" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="715" y="95" fill="#e2e8f0" font-size="13" text-anchor="middle">Amazon ECR</text>
  <text x="715" y="113" fill="#94a3b8" font-size="11" text-anchor="middle">container image</text>

  <line x1="180" y1="100" x2="230" y2="100" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="100" x2="430" y2="100" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="590" y1="100" x2="640" y2="100" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Terraform -->
  <rect x="30" y="200" width="180" height="70" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="120" y="228" fill="#e2e8f0" font-size="13" text-anchor="middle">Terraform</text>
  <text x="120" y="246" fill="#94a3b8" font-size="11" text-anchor="middle">VPC · EKS · ECR</text>
  <text x="120" y="261" fill="#94a3b8" font-size="11" text-anchor="middle">S3 + DynamoDB state</text>

  <!-- EKS cluster box -->
  <rect x="260" y="180" width="530" height="230" rx="10" fill="#0f172a" stroke="#334155" stroke-dasharray="4 3"/>
  <text x="280" y="202" fill="#93c5fd" font-size="12" font-weight="600">Amazon EKS Cluster</text>

  <!-- Helm -->
  <rect x="290" y="220" width="140" height="50" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="360" y="250" fill="#e2e8f0" font-size="12" text-anchor="middle">Helm Release</text>

  <!-- Pods -->
  <rect x="290" y="290" width="140" height="60" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="360" y="315" fill="#e2e8f0" font-size="12" text-anchor="middle">App Pods</text>
  <text x="360" y="332" fill="#94a3b8" font-size="10" text-anchor="middle">nginx-unprivileged:8080</text>

  <!-- HPA -->
  <rect x="460" y="290" width="140" height="60" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="530" y="315" fill="#e2e8f0" font-size="12" text-anchor="middle">HPA</text>
  <text x="530" y="332" fill="#94a3b8" font-size="10" text-anchor="middle">autoscale on CPU</text>

  <!-- Monitoring -->
  <rect x="630" y="220" width="140" height="130" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="700" y="245" fill="#e2e8f0" font-size="12" text-anchor="middle">kube-prometheus</text>
  <text x="700" y="261" fill="#e2e8f0" font-size="12" text-anchor="middle">-stack</text>
  <text x="700" y="285" fill="#94a3b8" font-size="10" text-anchor="middle">Prometheus</text>
  <text x="700" y="300" fill="#94a3b8" font-size="10" text-anchor="middle">Grafana</text>
  <text x="700" y="315" fill="#94a3b8" font-size="10" text-anchor="middle">Alertmanager</text>

  <line x1="360" y1="270" x2="360" y2="290" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="430" y1="320" x2="460" y2="320" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="290" x2="630" y2="270" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="210" y1="235" x2="260" y2="235" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="715" y1="130" x2="700" y2="220" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Browser / user -->
  <rect x="330" y="400" width="220" height="45" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="440" y="427" fill="#e2e8f0" font-size="12" text-anchor="middle">Browser (React + Leaflet UI)</text>
  <line x1="440" y1="400" x2="440" y2="350" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- External API -->
  <rect x="30" y="330" width="180" height="60" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="120" y="356" fill="#e2e8f0" font-size="12" text-anchor="middle">NASA EONET API</text>
  <text x="120" y="373" fill="#94a3b8" font-size="10" text-anchor="middle">wildfire event data</text>
  <line x1="210" y1="360" x2="330" y2="422" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
