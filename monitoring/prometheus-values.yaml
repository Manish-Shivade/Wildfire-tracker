prometheus:
  prometheusSpec:
    retention: 15d
    scrapeInterval: 30s
    additionalScrapeConfigs:
      - job_name: 'wildfire-tracker'
        static_configs:
          - targets: ['wildfire-tracker:80']
        metrics_path: /metrics
        scrape_interval: 15s

alertmanager:
  enabled: true
  alertmanagerSpec:
    retention: 120h

grafana:
  enabled: true
  adminPassword: "changeme"   # Change before deploying
  persistence:
    enabled: true
    size: 5Gi
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          orgId: 1
          folder: ""
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default
